<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="ituGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>
    <linearGradient id="ituBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f38ba8"/>
      <stop offset="50%" stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: url(#bgGrad); }
    .dot-red { fill: #f38ba8; }
    .dot-yellow { fill: #f9e2af; }
    .dot-green { fill: #a6e3a1; }
    .ascii { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; font-weight: bold; }
    .info { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; }
    .bar-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; }
  </style>
  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Window Controls -->
  <circle cx="24" cy="24" r="7" class="dot-red"/>
  <circle cx="46" cy="24" r="7" class="dot-yellow"/>
  <circle cx="68" cy="24" r="7" class="dot-green"/>

  <!-- Terminal Prompt Title -->
  <text x="96" y="28" font-family="'Fira Code', monospace" font-size="12" fill="#a6adc8">allrider1127 ~ fastfetch</text>

  <!-- Left Side: İTÜ ASCII Art Logo -->
  <text x="25" y="68" class="ascii" xml:space="preserve">
    <tspan x="25" dy="0"  fill="url(#ituGold)">   =%%%-                                  *%%#.   +%%#.</tspan>
    <tspan x="25" dy="14" fill="url(#ituGold)">   =%%%-                                  #%%%.   *%%%.</tspan>
    <tspan x="25" dy="14" fill="url(#ituGold)">     .</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">..... ..... .:...................:  ...........     ........</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">**#%%%%%**+ *@%%@%%#%%%%%%##%%@%%@- **#%%%%%*#=    -#*%%%#**</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#    *%%%-   .%%%@#   .+%%@-   :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#    #@@%    .%%%@*    -@%@=   :@%%@*          *@%:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#    =+++    .%%%@*    :+++:   :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#            .%%%@*            :@%%@*          *@%:</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#            .%%%@*            .@%%@#          #%%.</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">   %%%%#            .%%%@*             #@%%%-        -%@*</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">. :%%%@%..       .. :%%%@#.  .          *%@@@*=::::=#@%+</tspan>
    <tspan x="25" dy="14" fill="url(#ituBlue)">##########*     =#############:          :+*#%@@@%%%*=</tspan>
  </text>

  <!-- Tagline below ASCII art -->
  <text x="45" y="340" class="ascii" xml:space="preserve">
    <tspan x="50" dy="0" fill="#f5c2e7" font-size="12px">  Jahongir Orzikulov</tspan>
    <tspan x="50" dy="17" fill="#bac2de" font-size="11px">  Computational Mechanical Engineer</tspan>
    <tspan x="50" dy="15" fill="#bac2de" font-size="11px">  İTÜ Makina Fakültesi · 2024–2029</tspan>
  </text>

  <!-- Projects gauge visualization -->
  <rect x="50" y="395" width="300" height="8" rx="4" fill="#313244"/>
  <rect x="50" y="395" width="225" height="8" rx="4" fill="url(#accentGrad)"/>


  <!-- Right Side: Fastfetch Info Block -->
  <text x="490" y="85" class="info" xml:space="preserve">
    <tspan fill="#a6e3a1" font-weight="bold">allrider1127</tspan><tspan fill="#cdd6f4">@</tspan><tspan fill="#89b4fa" font-weight="bold">github</tspan>
    <tspan x="490" dy="14" fill="#585b70">─────────────────────────────────────────</tspan>
    <tspan x="490" dy="22"><tspan fill="#89b4fa" font-weight="bold">Name       </tspan><tspan fill="#cdd6f4">: Jahongir Orzikulov</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">Role       </tspan><tspan fill="#cdd6f4">: Computational Mechanical Engineer</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">University </tspan><tspan fill="#cdd6f4">: Istanbul Technical University (İTÜ)</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">Scholarship</tspan><tspan fill="#cdd6f4">: YTB Türkiye Bursları (Full-ride)</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">OS         </tspan><tspan fill="#cdd6f4">: Debian GNU/Linux 13 (trixie)</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">CPU        </tspan><tspan fill="#cdd6f4">: Intel i7-12700H (20 threads)</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">Shell      </tspan><tspan fill="#cdd6f4">: bash 5.2.37</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">Editor     </tspan><tspan fill="#cdd6f4">: nvim</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">Focus      </tspan><tspan fill="#cdd6f4">: CFD · FEA · Propulsion · Automation</tspan></tspan>
    <tspan x="490" dy="20"><tspan fill="#89b4fa" font-weight="bold">Containers </tspan><tspan fill="#cdd6f4">: Docker · DockerHub</tspan></tspan>
  </text>

  <!-- Color Palette Bar -->
  <rect x="490" y="380" width="35" height="15" rx="3" fill="#45475a"/>
  <rect x="525" y="380" width="35" height="15" rx="3" fill="#f38ba8"/>
  <rect x="560" y="380" width="35" height="15" rx="3" fill="#a6e3a1"/>
  <rect x="595" y="380" width="35" height="15" rx="3" fill="#f9e2af"/>
  <rect x="630" y="380" width="35" height="15" rx="3" fill="#89b4fa"/>
  <rect x="665" y="380" width="35" height="15" rx="3" fill="#cba6f7"/>
  <rect x="700" y="380" width="35" height="15" rx="3" fill="#94e2d5"/>
  <rect x="735" y="380" width="35" height="15" rx="3" fill="#bac2de"/>

  <rect x="490" y="395" width="35" height="15" rx="3" fill="#585b70"/>
  <rect x="525" y="395" width="35" height="15" rx="3" fill="#eba0ac"/>
  <rect x="560" y="395" width="35" height="15" rx="3" fill="#94e2d5"/>
  <rect x="595" y="395" width="35" height="15" rx="3" fill="#f38ba8"/>
  <rect x="630" y="395" width="35" height="15" rx="3" fill="#74c7ec"/>
  <rect x="665" y="395" width="35" height="15" rx="3" fill="#f5c2e7"/>
  <rect x="700" y="395" width="35" height="15" rx="3" fill="#89dceb"/>
  <rect x="735" y="395" width="35" height="15" rx="3" fill="#a6adc8"/>

  <!-- Bottom status bar -->
  <rect x="0" y="445" width="100%" height="23" fill="#181825"/>
  <rect x="0" y="456" width="100%" height="24" fill="#181825" rx="12"/>
  <text x="24" y="468" class="bar-text" fill="#a6adc8">
    <tspan fill="#a6e3a1">✦</tspan> allrider1127  <tspan fill="#585b70">│</tspan>  <tspan fill="#f9e2af">İTÜ Mechanical Engineering · 2024–2029</tspan>  <tspan fill="#585b70">│</tspan>  <tspan fill="#cba6f7">CFD · FEA · Propulsion · Automation</tspan>  <tspan fill="#585b70">│</tspan>  <tspan fill="#89b4fa">Debian GNU/Linux · Docker</tspan>
  </text>
</svg>
